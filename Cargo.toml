[package]
name = "devener"
version = "0.5.1"
edition = "2021"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
walkdir = "2.5"
humansize = "2.1"
inquire = "0.7"
colored = "2.1"
indicatif = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
trash = "5.1"
dirs = "5.0"
self_update = { version = "0.41", features = ["archive-tar", "archive-zip"] }
